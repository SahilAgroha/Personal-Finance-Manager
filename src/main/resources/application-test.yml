spring:
  application:
    name: personal-finance-manager-test

  datasource:
    url: jdbc:h2:mem:personal_finance_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: false

  session:
    store-type: jdbc

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: false
        same-site: lax

logging:
  level:
    org.springframework.security: WARN