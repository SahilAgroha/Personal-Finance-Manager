spring:
  application:
    name: personal-finance-manager

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/personal_finance_manager}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
      keepalive-time: 30000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: personal_finance

  jackson:
    time-zone: UTC

  session:
    store-type: jdbc

server:
  port: ${PORT:8080}

  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax

logging:
  level:
    org.springframework.security: INFO